name: Update Hermes docs mirror

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, offset from :00/:30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh docs
        run: python update-docs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes -- docs are already up to date."
            exit 0
          fi

          git commit -m "docs: automated refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
